[project]
name = "botinho777"
version = "0.1.0"
description = "Asistente conversacional de análisis de fútbol (Poisson + Telegram bot)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "streamlit>=1.32",
    "anthropic>=0.40",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
